<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tug of Knowledge: Balanced Duel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&family=Poppins:wght@400;600;700&display=swap');

        :root {
            --red-team: #E53935;
            --white-team: #1E293B;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #70C1FF 0%, #BFE3FF 60%, #4CAF50 60%, #388E3C 100%);
            overflow: hidden;
            margin: 0;
            user-select: none;
            height: 100vh;
        }

        .game-font {
            font-family: 'Bangers', cursive;
            letter-spacing: 2px;
        }

        /* Landscape Elements */
        .sun {
            position: absolute;
            top: 5%;
            left: 10%;
            width: 70px;
            height: 70px;
            background: #FFD54F;
            border-radius: 50%;
            box-shadow: 0 0 40px #FFE082;
            z-index: 0;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.85);
            border-radius: 50px;
            z-index: 1;
            animation: floatCloud 25s linear infinite;
        }

        @keyframes floatCloud {
            from { transform: translateX(-150px); }
            to { transform: translateX(100vw); }
        }

        .monumen {
            position: absolute;
            bottom: 40vh;
            left: 50%;
            transform: translateX(-50%);
            width: 70px;
            height: 160px;
            background: linear-gradient(180deg, #FFFFFF 0%, #E0E0E0 80%, #9E9E9E 100%);
            clip-path: polygon(30% 100%, 70% 100%, 70% 25%, 50% 0%, 30% 25%);
            z-index: 1;
            opacity: 0.9;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.2));
        }

        /* Rope & Flag */
        .rope-container {
            position: absolute;
            top: 58%;
            width: 220%;
            height: 18px;
            background: repeating-linear-gradient(45deg, #8B4513, #8B4513 12px, #A0522D 12px, #A0522D 24px);
            border: 2px solid #3E2723;
            border-radius: 9px;
            transform: translateY(-50%) translateX(var(--rope-pos, -50%));
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.25);
            z-index: 5;
            box-shadow: 0 8px 15px rgba(0,0,0,0.3);
        }

        .flag-marker {
            width: 34px;
            height: 50px;
            background: linear-gradient(to bottom, #E53935 50%, #FFFFFF 50%);
            border: 2px solid #000;
            position: absolute;
            left: 50%;
            transform: translateX(-50%) translateY(-24px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            border-radius: 3px;
        }

        /* Characters */
        .character-box {
            width: 110px;
            height: 140px;
            position: absolute;
            bottom: 22%;
            z-index: 6;
            transition: transform 0.2s ease;
        }

        .character-red { left: 12%; }
        .character-white { 
            right: 2%; 
            width: 440px; 
            height: 560px; 
            max-width: 42vw;
            max-height: 58vh;
            bottom: 14%;
            transform: scaleX(1); 
        }

        .pull-animation-left {
            animation: pullLeft 0.3s ease-in-out infinite alternate;
        }

        .pull-animation-right {
            animation: pullRight 0.3s ease-in-out infinite alternate;
        }

        @keyframes pullLeft {
            from { transform: translateX(0) rotate(0deg); }
            to { transform: translateX(-15px) rotate(-5deg); }
        }

        @keyframes pullRight {
            from { transform: scaleX(1) translateX(0) rotate(0deg); }
            to { transform: scaleX(1) translateX(15px) rotate(5deg); }
        }

        /* Question & UI Layout */
        .duel-container {
            position: absolute;
            bottom: 2vh;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 50;
            gap: 15px;
        }

        .team-box {
            flex: 1;
            max-width: 48%;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
            border-top: 6px solid var(--team-color);
            transition: all 0.2s ease;
        }

        .option-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 10px;
        }

        .duel-option-btn {
            padding: 10px 12px;
            background: #F1F5F9;
            border: 2px solid #CBD5E1;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #334155;
            text-align: left;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            min-height: 48px;
        }

        .duel-option-btn:hover:not(:disabled) {
            background: #E2E8F0;
            border-color: #94A3B8;
            transform: translateY(-2px);
        }

        .duel-option-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        .duel-option-btn.correct {
            background: #22C55E !important;
            color: white !important;
            border-color: #15803D !important;
            box-shadow: 0 0 12px rgba(34, 197, 94, 0.5);
        }

        .duel-option-btn.wrong {
            background: #EF4444 !important;
            color: white !important;
            border-color: #B91C1C !important;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.5);
        }

        .timer-bar {
            height: 8px;
            background: #E2E8F0;
            margin-top: 10px;
            border-radius: 4px;
            overflow: hidden;
        }

        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #F59E0B, #EF4444);
            width: 100%;
            transition: width 0.1s linear;
        }

        /* Floating Score Effect */
        .score-float {
            position: fixed;
            font-family: 'Bangers', cursive;
            font-size: 2.5rem;
            pointer-events: none;
            animation: floatUp 0.9s ease-out forwards;
            z-index: 200;
            text-shadow: 2px 2px 0 #000;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 1; }
            50% { transform: translateY(-40px) scale(1.2); opacity: 1; }
            100% { transform: translateY(-80px) scale(1); opacity: 0; }
        }

        /* Overlay Screens */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(6px);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #EF4444 0%, #DC2626 100%);
            color: white;
            padding: 12px 32px;
            border-radius: 9999px;
            font-family: 'Bangers', cursive;
            font-size: 1.6rem;
            letter-spacing: 1px;
            box-shadow: 0 8px 20px rgba(239, 68, 68, 0.4);
            transition: all 0.2s ease;
            cursor: pointer;
            border: 2px solid #FCA5A5;
        }

        .btn-primary:hover {
            transform: scale(1.06);
            box-shadow: 0 12px 25px rgba(239, 68, 68, 0.6);
        }

        .shake {
            animation: screenShake 0.3s ease-in-out;
        }

        @keyframes screenShake {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-4px); }
            80% { transform: translateX(4px); }
        }
    </style>
</head>
<body>

    <div id="game-viewport" class="relative w-screen h-screen overflow-hidden">
        <!-- Background Elements -->
        <div class="sun"></div>
        <div class="cloud" style="top: 8%; width: 120px; height: 40px; animation-duration: 28s;"></div>
        <div class="cloud" style="top: 15%; width: 160px; height: 50px; animation-duration: 38s; animation-delay: -12s;"></div>
        
        <div class="monumen"></div>

        <!-- Audio Control Toggle -->
        <button id="sound-toggle" onclick="toggleAudio()" class="absolute top-4 right-4 z-50 bg-white/90 p-3 rounded-full shadow-lg text-slate-700 hover:bg-white transition">
            <svg id="sound-icon" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/>
            </svg>
        </button>

        <!-- Tug Rope -->
        <div id="rope" class="rope-container" style="--rope-pos: -50%;">
            <div class="flag-marker"></div>
        </div>

        <!-- Red Character (SVG) -->
        <div id="char-red" class="character-box character-red">
            <svg viewBox="0 0 100 120" class="w-full h-full drop-shadow-lg">
                <!-- Body -->
                <rect x="30" y="45" width="40" height="45" fill="#E53935" rx="8" />
                <rect x="35" y="50" width="30" height="35" fill="#FFFFFF" opacity="0.2" rx="4" />
                <!-- Head -->
                <circle cx="50" cy="28" r="18" fill="#FBC02D" />
                <!-- Headband -->
                <rect x="30" y="16" width="40" height="8" fill="#E53935" rx="2" />
                <!-- Eyes -->
                <circle cx="44" cy="26" r="3" fill="#212121" />
                <circle cx="56" cy="26" r="3" fill="#212121" />
                <path d="M44 34 Q50 38 56 34" stroke="#212121" stroke-width="2" fill="none" stroke-linecap="round"/>
                <!-- Legs -->
                <rect x="36" y="90" width="10" height="25" fill="#1E293B" rx="3" />
                <rect x="54" y="90" width="10" height="25" fill="#1E293B" rx="3" />
                <!-- Arms holding rope -->
                <path d="M25 55 L50 50 L75 55" stroke="#FBC02D" stroke-width="7" stroke-linecap="round" fill="none"/>
            </svg>
        </div>

        <!-- White Character (Custom Image) -->
        <div id="char-white" class="character-box character-white">
            <img src="https://i.imgur.com/MUs1AMN.png" alt="Karakter Tim Putih" class="w-full h-full object-contain drop-shadow-lg" onerror="this.onerror=null; this.src='https://placehold.co/110x140/334155/FFFFFF?text=White+Team';">
        </div>

        <!-- Game Duel UI -->
        <div class="duel-container">
            <!-- Red Team UI -->
            <div id="box-red" class="team-box" style="--team-color: #E53935;">
                <div class="flex justify-between items-center mb-1">
                    <span class="text-red-600 font-extrabold text-sm tracking-wide">TIM MERAH</span>
                    <span id="level-red" class="text-[11px] bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-bold">EASY</span>
                </div>
                <p id="q-red" class="text-sm font-bold text-slate-800 h-11 overflow-hidden leading-snug">Memuat soal...</p>
                <div id="opt-red" class="option-grid"></div>
                <div class="timer-bar"><div id="timer-red-fill" class="timer-fill"></div></div>
            </div>

            <!-- White Team UI -->
            <div id="box-white" class="team-box" style="--team-color: #334155;">
                <div class="flex justify-between items-center mb-1">
                    <span id="label-white" class="text-slate-700 font-extrabold text-sm tracking-wide">TIM PUTIH</span>
                    <span id="level-white" class="text-[11px] bg-slate-100 text-slate-700 px-2 py-0.5 rounded-full font-bold">EASY</span>
                </div>
                <p id="q-white" class="text-sm font-bold text-slate-800 h-11 overflow-hidden leading-snug">Memuat soal...</p>
                <div id="opt-white" class="option-grid"></div>
                <div class="timer-bar"><div id="timer-white-fill" class="timer-fill"></div></div>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen" class="modal-overlay">
            <h1 class="game-font text-6xl md:text-7xl text-amber-400 mb-2 drop-shadow-lg">TUG OF KNOWLEDGE</h1>
            <p class="text-slate-200 mb-8 max-w-md text-sm md:text-base">Uji wawasan kebangsaan dan sejarahmu! Jawab pertanyaan dengan cepat dan tepat untuk menarik tali ke timmu.</p>
            
            <div class="flex flex-col sm:flex-row gap-4 mb-6">
                <button onclick="startGame('pvp')" class="btn-primary">
                    2 PLAYER DUEL
                </button>
                <button onclick="startGame('ai')" class="btn-primary" style="background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 100%); border-color: #93C5FD;">
                    VS BOT COMPUTER
                </button>
            </div>
        </div>

        <!-- Victory Screen -->
        <div id="victory-screen" class="modal-overlay" style="display: none;">
            <h1 id="winner-text" class="game-font text-7xl md:text-8xl mb-3 drop-shadow-md">TIM MERAH MENANG!</h1>
            <p id="winner-subtext" class="text-slate-200 text-lg mb-8">Selamat! Pengetahuanmu membawa kemenangan!</p>
            <button onclick="resetToMenu()" class="btn-primary">MAIN LAGI</button>
        </div>
    </div>

    <script>
        // Question Bank
        const questionBank = {
            easy: [
                { q: "Sila ke-3 Pancasila berbunyi...", options: ["Persatuan Indonesia", "Keadilan Sosial", "Kemanusiaan yang Adil", "Ketuhanan YME"], a: 0 },
                { q: "Ibu kota Indonesia saat ini adalah...", options: ["Surabaya", "Bandung", "Jakarta", "Medan"], a: 2 },
                { q: "Lambang dari sila ke-4 Pancasila adalah...", options: ["Padi Kapas", "Kepala Banteng", "Pohon Beringin", "Rantai Emas"], a: 1 },
                { q: "Lagu 'Indonesia Raya' diciptakan oleh...", options: ["WR Supratman", "C. Simanjuntak", "Ibu Sud", "Kusbini"], a: 0 },
                { q: "Dasar Negara Republik Indonesia adalah...", options: ["UUD 1945", "Pancasila", "Proklamasi", "TAP MPR"], a: 1 },
                { q: "Warna bendera Sang Saka Merah Putih bermakna...", options: ["Berani & Suci", "Kuat & Abadi", "Jaya & Makmur", "Suci & Berani"], a: 0 }
            ],
            medium: [
                { q: "Lembaga yang berwenang menguji UU terhadap UUD 1945 adalah...", options: ["Mahkamah Agung", "Mahkamah Konstitusi", "Komisi Yudisial", "DPR RI"], a: 1 },
                { q: "BPUPKI dibentuk pada tanggal...", options: ["1 Maret 1945", "29 Mei 1945", "1 Juni 1945", "17 Agustus 1945"], a: 0 },
                { q: "Kongres Sumpah Pemuda II dilaksanakan pada tahun...", options: ["1928", "1908", "1945", "1920"], a: 0 },
                { q: "Naskah Proklamasi diketik oleh...", options: ["Sayuti Melik", "Sukarni", "BM Diah", "Chaerul Saleh"], a: 0 },
                { q: "Lagu nasional 'Hari Merdeka' diciptakan oleh...", options: ["H. Mutahar", "Ismail Marzuki", "Ibu Sud", "Cornel Simanjuntak"], a: 0 }
            ],
            hard: [
                { q: "Semboyan 'Bhinneka Tunggal Ika' terdapat dalam Kitab...", options: ["Sutasoma", "Negarakertagama", "Pararaton", "Arjunawijaya"], a: 0 },
                { q: "Ketua dari organisasi BPUPKI adalah...", options: ["Dr. Radjiman W.", "Ir. Soekarno", "Moh. Hatta", "Mr. Soepomo"], a: 0 },
                { q: "Hari Lahir Pancasila diperingati setiap tanggal...", options: ["1 Juni", "1 Oktober", "17 Agustus", "28 Oktober"], a: 0 },
                { q: "Pengasah Pancasila sebagai dasar negara resmi terjadi pada tanggal...", options: ["18 Agustus 1945", "17 Agustus 1945", "1 Juni 1945", "22 Juni 1945"], a: 0 }
            ]
        };

        const levels = ['easy', 'medium', 'hard'];

        // Game State
        let state = {
            pos: 50,
            active: false,
            mode: 'pvp', // 'pvp' or 'ai'
            soundEnabled: true,
            teams: {
                red: { timer: null, currentQ: null, canAnswer: false, difficulty: 'easy' },
                white: { timer: null, currentQ: null, canAnswer: false, difficulty: 'easy' }
            }
        };

        const config = {
            pull: { easy: 7, medium: 11, hard: 16 },
            penalty: -5
        };

        // Web Audio Synthesizer
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }

        function playSound(type) {
            if (!state.soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2); // A5
                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, ctx.currentTime);
                    osc.frequency.setValueAtTime(160, ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.25, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.3);
                } else if (type === 'win') {
                    const notes = [440, 554.37, 659.25, 880];
                    notes.forEach((freq, index) => {
                        const noteOsc = ctx.createOscillator();
                        const noteGain = ctx.createGain();
                        noteOsc.connect(noteGain);
                        noteGain.connect(ctx.destination);
                        noteOsc.frequency.value = freq;
                        noteGain.gain.setValueAtTime(0.2, ctx.currentTime + index * 0.12);
                        noteGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + index * 0.12 + 0.3);
                        noteOsc.start(ctx.currentTime + index * 0.12);
                        noteOsc.stop(ctx.currentTime + index * 0.12 + 0.3);
                    });
                }
            } catch (e) { console.log(e); }
        }

        function toggleAudio() {
            state.soundEnabled = !state.soundEnabled;
            const soundIcon = document.getElementById('sound-icon');
            if (state.soundEnabled) {
                soundIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072M18.364 5.636a9 9 0 010 12.728M11 5L6 9H2v6h4l5 4V5z"/>`;
            } else {
                soundIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" stroke-dasharray="2 2"/><line x1="17" y1="9" x2="23" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="23" y1="9" x2="17" y2="15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>`;
            }
        }

        function startGame(mode) {
            getAudioContext();
            state.mode = mode;
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('label-white').textContent = mode === 'ai' ? 'BOT COMPUTER' : 'TIM PUTIH';
            
            state.pos = 50;
            state.active = true;
            updateRope();

            loadQuestion('red');
            loadQuestion('white');
        }

        function loadQuestion(team) {
            if (!state.active) return;

            const difficulty = levels[Math.floor(Math.random() * levels.length)];
            state.teams[team].difficulty = difficulty;

            const pool = questionBank[difficulty];
            const qData = pool[Math.floor(Math.random() * pool.length)];

            state.teams[team].currentQ = qData;
            state.teams[team].canAnswer = true;

            document.getElementById(`q-${team}`).textContent = qData.q;
            document.getElementById(`level-${team}`).textContent = difficulty.toUpperCase();

            const optCont = document.getElementById(`opt-${team}`);
            optCont.innerHTML = '';

            qData.options.forEach((txt, i) => {
                const btn = document.createElement('button');
                btn.className = 'duel-option-btn';
                btn.textContent = txt;
                btn.onclick = () => handleAnswer(team, i === qData.a, difficulty, btn);
                if (team === 'white' && state.mode === 'ai') {
                    btn.disabled = true;
                }
                optCont.appendChild(btn);
            });

            startTeamTimer(team);

            if (team === 'white' && state.mode === 'ai') {
                triggerAITurn(qData, difficulty);
            }
        }

        function triggerAITurn(qData, difficulty) {
            const delay = Math.random() * 2500 + 1500; // 1.5 - 4.0 seconds delay
            setTimeout(() => {
                if (!state.active || !state.teams.white.canAnswer) return;
                
                // AI accuracy based on difficulty
                const accuracy = difficulty === 'easy' ? 0.85 : (difficulty === 'medium' ? 0.70 : 0.55);
                const isCorrect = Math.random() < accuracy;
                
                let selectedIndex = qData.a;
                if (!isCorrect) {
                    const wrongOpts = [0,1,2,3].filter(idx => idx !== qData.a);
                    selectedIndex = wrongOpts[Math.floor(Math.random() * wrongOpts.length)];
                }

                const buttons = document.querySelectorAll('#opt-white .duel-option-btn');
                if (buttons[selectedIndex]) {
                    handleAnswer('white', isCorrect, difficulty, buttons[selectedIndex]);
                }
            }, delay);
        }

        function startTeamTimer(team) {
            let timeLeft = 100;
            const fill = document.getElementById(`timer-${team}-fill`);

            if (state.teams[team].timer) clearInterval(state.teams[team].timer);

            state.teams[team].timer = setInterval(() => {
                timeLeft -= 1.4;
                fill.style.width = Math.max(0, timeLeft) + '%';

                if (timeLeft <= 0) {
                    clearInterval(state.teams[team].timer);
                    handleAnswer(team, false, state.teams[team].difficulty, null);
                }
            }, 100);
        }

        function handleAnswer(team, isCorrect, level, btn) {
            if (!state.teams[team].canAnswer || !state.active) return;

            state.teams[team].canAnswer = false;
            clearInterval(state.teams[team].timer);

            if (btn) btn.classList.add(isCorrect ? 'correct' : 'wrong');

            playSound(isCorrect ? 'correct' : 'wrong');

            const move = isCorrect ? config.pull[level] : config.penalty;
            const dir = team === 'red' ? -1 : 1;

            state.pos += (move * dir);
            state.pos = Math.max(0, Math.min(100, state.pos));

            // Visual Pull Feedback
            const char = document.getElementById(`char-${team}`);
            const animClass = team === 'red' ? 'pull-animation-left' : 'pull-animation-right';
            char.classList.add(animClass);
            setTimeout(() => char.classList.remove(animClass), 600);

            showScoreEffect(team, isCorrect ? `+${move}` : `${move}`, !isCorrect);
            updateRope();

            if (!isCorrect) {
                document.getElementById('game-viewport').classList.add('shake');
                setTimeout(() => document.getElementById('game-viewport').classList.remove('shake'), 300);
            }

            if (state.pos <= 0) {
                finish('TIM MERAH');
            } else if (state.pos >= 100) {
                finish(state.mode === 'ai' ? 'BOT COMPUTER' : 'TIM PUTIH');
            } else {
                setTimeout(() => {
                    if (state.active) loadQuestion(team);
                }, 850);
            }
        }

        function showScoreEffect(team, val, isNegative = false) {
            const box = document.getElementById(`box-${team}`);
            const rect = box.getBoundingClientRect();
            const effect = document.createElement('div');
            effect.className = 'score-float';
            effect.textContent = val;
            effect.style.color = isNegative ? '#EF4444' : '#22C55E';
            effect.style.left = (rect.left + rect.width / 2 - 20) + 'px';
            effect.style.top = (rect.top - 10) + 'px';
            document.body.appendChild(effect);
            setTimeout(() => effect.remove(), 900);
        }

        function updateRope() {
            // Mapping state.pos (0 - 100) to rope transform range (-100% to 0%)
            const visual = -100 + (state.pos * 1.0);
            document.getElementById('rope').style.setProperty('--rope-pos', `${visual}%`);
        }

        function finish(winner) {
            state.active = false;
            clearInterval(state.teams.red.timer);
            clearInterval(state.teams.white.timer);

            playSound('win');

            const screen = document.getElementById('victory-screen');
            const winnerText = document.getElementById('winner-text');
            screen.style.display = 'flex';
            winnerText.textContent = winner + " MENANG!";
            winnerText.style.color = winner.includes('MERAH') ? '#EF4444' : '#38BDF8';
        }

        function resetToMenu() {
            document.getElementById('victory-screen').style.display = 'none';
            document.getElementById('start-screen').style.display = 'flex';
        }

        updateRope();
    </script>
</body>
</html>
